# /etc/nginx/sites-available/bizdaoson.uz.conf
# Reverse proxy for Aqilbek.uz (Next.js container on 127.0.0.1:3100).
# HTTPS lines are added by: sudo certbot --nginx -d bizdaoson.uz -d www.bizdaoson.uz

server {
    listen 80;
    listen [::]:80;
    server_name bizdaoson.uz www.bizdaoson.uz;

    client_max_body_size 2m;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3100;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # AI answers are streamed — do not buffer them.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
    }
}
